services:
  # База данных
  db:
    image: postgres:17
    container_name: aerogroup_site_db
    restart: always
    env_file:
      - ./support_ag_ife_com/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aerogroup_net

  # Django + Gunicorn
  web:
    build: .
    container_name: aerogroup_site_web
    restart: always
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn support_ag_ife_com.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - monitoring_reports:/app/monitoring_reports
      - ./support_ag_ife_com/logs:/app/logs
    env_file:
      - ./support_ag_ife_com/.env
    depends_on:
      - db
    extra_hosts:
      - "helpdesk-su.ag-ife.com:178.176.19.13"
      - "helpdesk-fv.ag-ife.com:62.64.17.121"
      - "mail.ag-ife.com:10.1.0.3"
    networks:
      - aerogroup_net

  # Nginx
  nginx:
    image: nginx:stable-alpine
    container_name: aerogroup_site_connect
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    networks:
      - aerogroup_net

networks:
  aerogroup_net:
    driver: bridge

volumes:
  postgres_data:
  static_volume:
  media_volume:
  monitoring_reports: