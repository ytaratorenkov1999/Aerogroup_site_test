{% extends 'base.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'monitoring/css/monitoring.css' %}?v=15">
<div class="mon" id="monRoot" data-url="{% url 'monitoring:data' %}{% if demo %}?demo=1{% endif %}">
    <div class="mon-toolbar">
        {% if demo %}<span class="mon-muted">Тестовые данные</span>{% endif %}
        <button class="mon-refresh" id="monRefresh" type="button">Обновить</button>
    </div>
    <div class="mon-banner" id="monBanner" role="alert" hidden></div>
    <div class="mon-table-wrap">
        <table class="mon-table">
            <thead>
                <tr><th>ID</th><th>Сервер</th><th>Дата проверки</th></tr>
            </thead>
            <tbody id="monServers">
                {% for server in servers %}
                <tr class="mon-server" tabindex="0" role="button" data-id="{{ server.id }}" aria-label="Открыть сведения о сервере {{ server.name }}">
                    <td class="mon-id">#{{ server.id }}</td>
                    <td><strong>{{ server.name }}</strong></td>
                    <td class="mon-date">Загрузка…</td>
                </tr>
                {% empty %}
                <tr><td colspan="3" class="mon-empty">Серверов пока нет. Добавьте сервер и агента в админке.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <div class="mon-overlay" id="monOverlay" hidden>
        <section class="mon-modal" role="dialog" aria-modal="true" aria-labelledby="monModalTitle">
            <div class="mon-modal__head">
                <div>
                    <h3 id="monModalTitle"></h3>
                    <div class="mon-modal__ip" id="monModalIp"></div>
                </div>
                <button type="button" class="mon-close" id="monClose" aria-label="Закрыть">×</button>
            </div>
            <div class="mon-tabs" role="tablist" aria-label="Проверки площадки">
                <button id="monTab-network" class="mon-tab active" type="button" role="tab" aria-selected="true" aria-controls="monTabContent" data-tab="network">Сеть</button>
                <button id="monTab-disks" class="mon-tab" type="button" role="tab" aria-selected="false" aria-controls="monTabContent" data-tab="disks" tabindex="-1">Диски</button>
                <button id="monTab-reports" class="mon-tab" type="button" role="tab" aria-selected="false" aria-controls="monTabContent" data-tab="reports" tabindex="-1">Отчёты</button>
                <button id="monTab-content" class="mon-tab" type="button" role="tab" aria-selected="false" aria-controls="monTabContent" data-tab="content" tabindex="-1">Контент</button>
            </div>
            <div class="mon-tab-content" id="monTabContent" role="tabpanel" aria-labelledby="monTab-network"></div>
        </section>
    </div>
</div>
<script src="{% static 'monitoring/js/monitoring.js' %}?v=15" defer></script>
{% endblock %}
