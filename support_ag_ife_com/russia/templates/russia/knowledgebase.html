{% extends 'base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'russia/css/knowledgebase.css' %}">

<div id="knowledgeApp"
     data-structure-url="{% url 'russia:get_structure' %}"
     data-search-url="{% url 'russia:search' %}"
     data-article-base="/bdrussia/article/"
     data-category-base="/bdrussia/category/">

    <div class="akr-header-bar">
        <div class="breadcrumb">
            <a href="{% url 'russia:index' %}">База знаний Россия</a>
        </div>
        <div class="akr-action-buttons">
            {% if can_edit %}
            <a href="{% url 'russia:category_create' %}" class="btn btn-primary">
                <img src="{% static 'support/images/plus_akr.svg' %}" class="btn-icon" alt=""> Категория
            </a>
            <a href="{% url 'russia:article_create' %}" class="btn btn-primary">
                <img src="{% static 'support/images/plus_akr.svg' %}" class="btn-icon" alt=""> Статья
            </a>
            {% endif %}
        </div>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-input"
               placeholder="Поиск по базе знаний Россия...">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M11 6C13.7614 6 16 8.23858 16 11M16.6588 16.6549L21 21M19 11C19 15.4183 15.4183 19 11 19C6.58172 19 3 15.4183 3 11C3 6.58172 6.58172 3 11 3C15.4183 3 19 6.58172 19 11Z"
                  stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </div>

    <div id="searchResults" class="search-results">
        <div id="searchResultsGrid" class="search-results-grid"></div>
    </div>

    <div id="contentSection" class="content-section">
        <div class="categories-grid" id="categoriesGrid">
            <div style="text-align:center;color:#6c757d;font-size:13px;grid-column:1/-1">
                Загрузка категорий...
            </div>
        </div>
    </div>
</div>

<script src="{% static 'russia/js/knowledgebase.js' %}"></script>

{% endblock %}
